function ensureMembers() {

}

function templateList(){let d=store.draft;const a=[['record','仅记分','轻松记录，不比较名次','record','individual',true],['stroke','个人比杆','比本轮累计成绩','stroke','individual',true],['match2','两人比洞','每洞一较高下','match','individual',d.players.length===2],['match4','四人两队比洞','每队每洞取较好成绩','match','pairs',d.players.length===4],['stableford','标准积分','小鸟 3 分，标准杆 2 分','points',d.group,true],['8421','8421 积分','老鹰 8 分，小鸟 4 分','points',d.group,true]];return `<div class="templates">${a.map(([id,name,desc,mode,group,ok])=>`<button class="template ${d.mode===mode&&(mode!=='points'||d.points===(id==='8421'?'8421':'stableford'))&&(mode!=='match'||d.group===group)?'active':''}" data-template="${id}" ${!ok?'disabled':''}><strong>${name}</strong><small>${ok?desc:id==='match2'?'需要 2 人，可返回上一步调整':'需要 4 人，可返回上一步调整'}</small></button>`).join('')}</div>`}
function handicapUI(){let d=store.draft;return `<div class="block"><div class="block-head"><h3>03 · 让杆方式</h3><span>比较总杆还是净杆</span></div>${d.mode==='record'?'<p class="option-desc">仅记分保留实际总杆，不使用让杆排名。</p>':`${choices('basis',[['gross','总杆 · 不让杆'],['net','净杆 · 约定让杆']],d.basis)}${d.basis==='net'?`<label class="field-label">让杆怎么填</label>${select('handicap',[['round','填写本轮让杆总数，按 SI 分配'],['manual','逐洞指定让杆']],d.handicap)}${d.players.map((p,i)=>`<div class="handicap-row"><span>${esc(p.name)}</span>${d.handicap==='round'?`<input type="number" min="0" max="${G.holes(d).length*3}" class="form-control" data-handicap="${i}" aria-label="${esc(p.name)} 本轮让杆数" value="${p.handicap}"><span style="flex:0">杆</span>`:`<button class="text-button" data-manual="${i}">合计 ${G.sum(G.holes(d).map(h=>p.manual[h]))} 杆 · 编辑 →</button>`}</div>`).join('')}<p class="hint">这是球友约定的本轮让杆数，不是官方差点指数。${d.mode==='match'&&d.handicap==='round'?'比洞赛先减去参赛者最低让杆数，再分配差额。':''}</p><button class="text-button" data-action="allowances">查看逐洞让杆预览 ↗</button>`:''}`}</div>`}
const policyFields=[['ob','出界 / 遗失球',[['official','按正式规则处理'],['custom','按自定义说明']]],['water','下水 / 罚杆区',[['official','按正式规则处理'],['custom','按自定义说明']]],['rough','长草 / 树林',[['official','按正式规则处理'],['custom','按自定义说明']]],['relief','球车道等补救',[['official','按正式规则补救'],['custom','按自定义说明']]],['search','找球 / 抛球范围',[['official','按正式规则处理'],['custom','按自定义说明']]],['putt','短推处理',[['hole','必须入洞'],['opponent','比洞：对手承认下一杆'],['30','友谊局：30cm 内免推'],['50','友谊局：50cm 内免推'],['custom','按自定义说明']]],['pickup','连续失误 / 捡球',[['follow','按主赛玩法处理'],['custom','按自定义说明']]]];
function policyUI(){let d=store.draft,p=d.policy;return `<div class="block"><div class="block-head"><h3>04 · 本场打球约定</h3><span>开球前说清楚</span></div>${choices('policy.type',[['official','正式规则'],['small','小流氓'],['large','大流氓'],['custom','自定义']],p.type)}${p.type==='official'?'<p class="option-desc">按高尔夫球规则及本场有效当地规则。总杆已含罚杆，本工具不自动判断违规或替代裁判。</p>':`<p class="hint warn">“小流氓”“大流氓”没有统一版本。下方初始选项保留正式处理，请逐项修改并确认你们自己的约定。</p><div class="rule-grid">${policyFields.map(([key,title,opts])=>`<div class="rule-field"><label class="field-label">${title}</label>${select('policy.'+key,opts.filter(([v])=>v!=='opponent'||d.mode==='match'),p[key])}</div>`).join('')}</div><label class="field-label">自定义处理说明 ${Object.values(p).includes('custom')?'（必填）':'（选填）'}</label><textarea class="form-control" data-setting="policy.notes" maxlength="600" placeholder="写清适用情况、处理动作、罚几杆或洞结果。例如某一区域如何补球，是否允许免推。">${esc(p.notes)}</textarea><p class="hint">文字约定由球友执行，记分员填入已经确认的成绩。不会根据“下水”等标签自动追加罚杆。</p><label class="check-choice rule-confirm"><input type="checkbox" data-setting="policy.confirmed" ${p.confirmed?'checked':''}><span>我们已确认以上全部约定<small>友谊局约定会显示在记分卡中。</small></span></label>`}</div>`}
function rulesStep(){let d=store.draft,teams=[4,6].includes(d.players.length),skins=d.mode!=='match'&&d.group==='individual'&&d.cap==='none';return templateList()+`<div class="block"><div class="block-head"><h3>01 · ${G.modeName(d)}</h3><span>本场主玩法</span></div><p class="option-desc">${d.mode==='record'?'只记录实际成绩，不自动排出冠军。':d.mode==='stroke'?'累计杆数少者领先；进行中同时显示已完成洞数。':d.mode==='match'?'逐洞比较双方成绩，领先洞数超过剩余洞数即获胜；打满仍平则记平局。':'逐洞换算积分，累计积分高者领先。积分与实际总杆分别保存。'}</p>${d.mode==='points'?`<table class="points-mini"><thead><tr>${['≤−3','老鹰','小鸟','标准杆','柏忌','≥+2'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr>${(d.points==='8421'?[16,8,4,2,1,0]:['5+',4,3,2,1,0]).map(x=>`<td>${x}</td>`).join('')}</tr></tbody></table><p class="hint">${d.points==='8421'?'本 Demo 约定：低于标准杆 3 杆及更好均为 16 分；这是球友玩法，不是统一国际标准。':'标准定分式：max(0, 2 − 相对标准杆)；越低于标准杆，积分越多。'}</p>`:''}${d.mode==='stroke'&&d.group==='individual'?`<label class="field-label">单洞是否封顶</label>${select('cap',Object.entries(G.capName).filter(([key])=>key!=='netdouble'||d.basis==='net'),d.cap)}<p class="hint">封顶只改变比赛计分，实际杆数仍保留。捡球与实际完洞分开记录。</p>`:''}</div><div class="block"><div class="block-head"><h3>02 · 个人还是组队</h3><span>${d.players.length} 位球友</span></div>${d.mode==='record'?'<p class="option-desc">个人记录，全组展示；不生成队伍排名。</p>':`<div class="choice-row"><button data-choice="group" data-value="individual" class="${d.group==='individual'?'active':''}" ${d.mode==='match'&&d.players.length!==2?'disabled':''}>各自比赛</button><button data-choice="group" data-value="pairs" class="${d.group==='pairs'?'active':''}" ${!teams||(d.mode==='match'&&d.players.length!==4)?'disabled':''}>两人一队 · 四球</button></div><p class="hint">${teams?'各打各球；每洞取队内较低杆数，积分赛取较高积分。':'两人一队需要 4 或 6 人；当前可各自比赛。'}</p>${d.group==='pairs'?d.players.map((p,i)=>`<label class="team-row"><span>${esc(p.name)}</span><select class="form-control" data-team="${i}" aria-label="${esc(p.name)} 所属队伍">${options(Array.from({length:d.players.length/2},(_,t)=>[t,String.fromCharCode(65+t)+' 队']),p.team)}</select></label>`).join(''):''}`}</div>`+handicapUI()+policyUI()+`<div class="block"><div class="block-head"><h3>05 · 附加玩法</h3><span>可多选 · 独立计算</span></div><label class="check-choice"><input type="checkbox" data-setting="sides.birdie" ${d.sides.birdie?'checked':''}><span>抓鸟奖励<small>小鸟 1 点、老鹰 2 点、信天翁或更好 3 点。</small></span></label>${d.sides.birdie&&d.basis==='net'?select('birdieBasis',[['gross','按实际总杆抓鸟'],['net','按净杆抓鸟']],d.birdieBasis):''}<label class="check-choice ${!skins?'disabled':''}"><input type="checkbox" data-setting="sides.skins" ${d.sides.skins?'checked':''} ${!skins?'disabled':''}><span>Skins 抢洞<small>${skins?'每洞独自最低杆获得 1 点；并列处理可选。':'仅支持个人仅记分、常规比杆或积分赛。'}</small></span></label>${d.sides.skins?`${choices('skinsCarry',[[true,'并列滚入下一洞'],[false,'并列当洞作废']],d.skinsCarry)}<p class="hint">按${d.basis==='net'?'净杆':'实际总杆'}比较，不比较积分。遇到缺分、捡球或免推记录，结算暂停；末洞并列点数保留未分配。</p>`:''}</div>`}
function summaryHTML(d){const hs=G.holes(d);return `<dl class="summary-list"><div><dt>球场</dt><dd>${esc(d.course)}<br>${d.segment==='front'?'前九':d.segment==='back'?'后九':'18'}洞 · 标准杆 ${G.sum(hs.map(h=>G.PAR[h]))} · 示例</dd></div><div><dt>主玩法</dt><dd>${G.modeName(d)}${d.group==='pairs'?' · 两人一队':''}<br>${d.mode==='record'?'只记录，不排名':d.basis==='net'?'净杆比较':'总杆比较'}${d.cap!=='none'?' · '+G.capName[d.cap]:''}</dd></div><div><dt>球友</dt><dd>${d.group==='pairs'?G.units(d).map(u=>u.name+'：'+u.members.map(i=>esc(d.players[i].name)).join(' / ')).join('<br>'):d.players.map(p=>esc(p.name)).join(' / ')}</dd></div><div><dt>让杆</dt><dd>${d.basis==='net'?d.players.map((p,i)=>esc(p.name)+' '+G.sum(G.allowances(d,i))+' 杆').join('<br>'):'不让杆'}</dd></div><div><dt>打球约定</dt><dd>${G.policyName[d.policy.type]}${d.policy.type!=='official'?'<br>按已确认的球友约定执行':''}</dd></div><div><dt>附加玩法</dt><dd>${[d.sides.birdie?'抓鸟奖励（'+(d.birdieBasis==='net'?'净杆':'实际总杆')+'）':'',d.sides.skins?'Skins（'+(d.skinsCarry?'并列滚存':'并列作废')+'）':''].filter(Boolean).join('<br>')||'无'}</dd></div>${d.mode==='points'?`<div><dt>积分表</dt><dd>${d.points==='8421'?'≤−3:16 / 老鹰8 / 小鸟4 / Par2 / 柏忌1 / ≥+2:0':'老鹰4 / 小鸟3 / Par2 / 柏忌1 / ≥+2:0'}</dd></div>`:''}</dl>`}
function confirmStep(){let d=store.draft;return `<div class="block"><div class="block-head"><h3>${esc(d.name)}</h3><span>${d.players.length} 人 · ${G.holes(d).length} 洞</span></div>${summaryHTML(d)}</div>${d.policy.type!=='official'?`<div class="block"><div class="block-head"><h3>已确认的具体约定</h3></div>${policySummary(d)}</div>`:''}<div class="record-status"><span class="status-circle">✓</span><div><strong>只填一次杆数，自动算出各项结果</strong><p>主赛与附加玩法分别展示。开始后保留本场规则，变更玩法请另建球局。</p></div></div><p class="footnote">独立 Demo · 不连接现有小程序 · 不产生真实赛事提交</p>`}
function policySummary(d){if(d.policy.type==='official')return '<p class="option-desc">按高尔夫球规则和本场有效当地规则处理。总杆包括罚杆。</p>';return `<dl class="summary-list">${policyFields.map(([key,title,opts])=>`<div><dt>${title}</dt><dd>${esc(opts.find(([v])=>v===d.policy[key])?.[1]||d.policy[key])}</dd></div>`).join('')}${d.policy.notes?`<div class="full"><dt>补充说明</dt><dd>${esc(d.policy.notes).replace(/\n/g,'<br>')}</dd></div>`:''}</dl>`}
function createView(){return createHero()+`<section class="content">${notice?'<div class="error-box" role="alert">'+esc(notice)+'</div>':''}${store.step===1?basics():store.step===2?rulesStep():confirmStep()}</section>`}
function roundHero(view){const conf=c(),r=store.round,s=G.summary(conf,r.records,activeIndex()),hs=G.holes(conf),match=conf.mode==='match'?G.match(conf,r.records,r.overrides):null;let metric=conf.mode==='points'?s.value:conf.mode==='match'?match.result:s.actual?G.fmt(s.gross-s.par):'—';return `<section class="hero round"><div class="round-overline"><span>QINGYE · ROUND WITH FRIENDS</span><span>${conf.players.length} 人 · ${hs.length} 洞</span></div><h2>${view==='card'?'全组记分卡':view==='result'?'本场结果':esc(conf.name)}</h2><button class="rule-link" data-action="showrules">${esc(describe(conf))}　ⓘ</button>${view!=='score'?`<div class="hero-metrics"><div><small>${conf.mode==='points'?'我的积分':conf.mode==='match'?'对阵状态':'我的相对标准杆'}</small><strong>${metric}</strong></div><div><small>我的已记总杆</small><strong>${s.actual?s.gross:'—'}</strong></div><div><small>我的记录进度</small><strong>${s.done}<em>/ ${hs.length} 洞</em></strong></div></div>`:''}${conf.policy.type!=='official'?'<div class="policy-badge">球友自定义约定 · '+G.policyName[conf.policy.type]+'</div>':''}</section>`}
function previewRecords(){let records=G.clone(store.round.records);draftScores.forEach((r,i)=>records[i][store.round.hole]=r);return records}
function playerDetail(i){const conf=c(),h=store.round.hole,r=draftScores[i],d=G.derived(conf,i,h,r);if(!r)return '未填不会自动当作标准杆';if(r.kind==='pickup')return conf.mode==='points'?'已捡球，本洞 0 分':conf.cap!=='none'?'已捡球，封顶计 '+d.value+' 杆':'不计个人杆数，采用队友有效成绩';let t=`总杆 ${d.gross}`;if(conf.basis==='net')t+=` − 让 ${d.handicap} = 净杆 ${d.net}`;if(conf.mode==='points')t+=` · 本洞 ${d.value} 分`;if(conf.cap!=='none')t+=` · 比赛计 ${d.value} 杆`;if(r.kind==='given')t+=' · 含承认 / 约定推杆';return t}
function scoreView(){
 const conf=c(),r=store.round,h=r.hole,hs=G.holes(conf),filled=draftScores.filter(Boolean).length;
 const people=conf.players.map((p,i)=>({p,i}));
 if(!isOwner()) people.sort((a,b)=>(b.i===activeIndex())-(a.i===activeIndex()));
 const canPick=conf.mode==='points'||conf.cap!=='none'||conf.group==='pairs';
 const teamPreview=conf.group==='pairs'?G.units(conf).map(u=>({u,v:G.unitHole(conf,previewRecords(),u,h)})):[];
 return roundHero('score')+`<section class="content scoring">
 <div class="hole-detail"><div class="hole-title">${String(h+1).padStart(2,'0')}<span>第 ${h+1} 洞</span></div><div class="hole-meta"><strong>PAR ${G.PAR[h]}</strong><small>${G.YARDS[h]} YDS</small></div></div>
 <div class="holes">${hs.map(x=>`<button class="hole-btn ${(isOwner()?r.records.every(a=>a[x])||r.overrides[x]!==undefined:!!r.records[activeIndex()][x])?'done':''} ${x===h?'current':''}" data-hole="${x}" aria-label="第 ${x+1} 洞">${x+1}</button>`).join('')}</div>
 <div class="current-holes"><span>本洞已填 ${filled} / ${conf.players.length} 人</span><span>${r.finished?'本轮已结束，成绩锁定':dirty()?'有待保存的修改':isOwner()?'可分别保存，不必全组填齐':'只修改自己的成绩'}</span></div>
 <div class="players">${people.map(({p,i})=>{
   const rr=draftScores[i],sum=G.summary(conf,r.records,i),hand=G.allowances(conf,i)[h],editable=canEdit(i),last=latestEdit(i,h),pending=!sameRecord(rr,r.records[i][h]);
   return `<article class="player ${selected===i?'selected':''} ${i===activeIndex()?'own-player':''} ${editable?'':'readonly-player'}">
    <div class="player-head"><button class="player-select" data-player="${i}"><span class="avatar">${esc(p.name[0])}</span><span><span class="player-name">${esc(p.name)}${i===activeIndex()?'<span class="me">我</span>':''}${conf.group==='pairs'?`<span class="me">${String.fromCharCode(65+p.team)}队</span>`:''}</span><span class="player-info" style="display:block">${sum.actual?'已记 '+sum.gross+' 杆':'尚未记分'} · ${sum.done} 洞${conf.basis==='net'?' · 让 '+hand:''}</span></span></button><div class="stepper"><button data-step="-1" data-person="${i}" aria-label="${esc(p.name)} 减一杆" ${editable?'':'disabled'}>−</button><span class="stroke ${!rr?'empty':diffClass((rr.gross??G.PAR[h])-G.PAR[h])}">${rr?rr.kind==='pickup'?'捡':rr.gross:'—'}</span><button data-step="1" data-person="${i}" aria-label="${esc(p.name)} 加一杆" ${editable?'':'disabled'}>+</button></div></div>
    ${selected===i?`<div class="player-editor">${editable?`<div class="quick-row">${[G.PAR[h]-1,G.PAR[h],G.PAR[h]+1].map(v=>`<button class="quick ${rr?.gross===v?'on':''}" data-score="${v}" data-person="${i}"><b>${v}</b>${v<G.PAR[h]?'小鸟':v===G.PAR[h]?'标准杆':'柏忌'}</button>`).join('')}</div>`:''}
    <div class="score-explain">${playerDetail(i)}</div>
    ${editable?`<div class="score-row-actions">${canPick?`<button class="tiny-link" data-pickup="${i}">${conf.group==='pairs'&&conf.mode!=='points'?'捡球 / 不计本洞':'记录捡球'}</button>`:'<span>确认杆数包含罚杆</span>'}${rr?.gross!=null&&(conf.policy.putt!=='hole'&&conf.policy.putt!=='custom')?`<label><input type="checkbox" data-given="${i}" ${rr.kind==='given'?'checked':''}>${conf.mode==='match'&&conf.policy.putt==='opponent'?'含对手承认的下一杆':'含约定免推'}</label>`:''}<button class="tiny-link" data-clear="${i}">清空</button></div>`:`<p class="readonly-note">${r.finished?'本轮已锁定，请创建者核对后解锁更正。':'此成绩可由本人或创建者修改。'}</p>`}</div>`:''}
    <div class="entry-meta"><span>${pending?'待保存':last?'由 '+esc(last.name)+(last.actor===i?' 自记':' 代记'):'等待记分'}</span><span>${editable?(i===activeIndex()?'本人可编辑':'可代记'):r.finished?'已锁定':'仅查看'}</span></div>
   </article>`;
 }).join('')}</div>

 if(a==='unlock'){modal('更正本地误录','<p>解锁后可修改记录并重算结果。这只是本地友谊局演示；正式赛事已确认结果或球场上已经作出的让步，应按赛事程序处理。</p><button class="primary" data-action="confirmunlock">解锁本轮记录</button>');return}if(a==='confirmunlock'){store.round.finished=false;addHistory('unlock');store.round.view='score';loadScores();persist();closeModal();render();return}
 if(a==='settings'){modal('球局与演示',`<p>所有操作只保存在此独立 Demo，不修改现有小程序。</p>${store.round?'<button class="secondary" data-action="members">切换演示身份</button><button class="secondary" data-action="history">记分与修改记录</button><button class="secondary" data-action="showrules">查看本场规则</button>':''}${isOwner()?`<button class="secondary" data-action="new">创建新球局</button>${store.round?'<button class="secondary" data-action="filldemo">载入剩余示例成绩</button>':''}<button class="secondary" data-action="reset">清空并重新体验</button>`:'<p>结束球局与解锁更正由创建者操作。</p>'}`);return}
 if(a==='reset'){modal('重新体验','<p>将清空此 Demo 的当前球局与创建草稿，不影响其他软件。</p><button class="primary" data-action="confirmreset">重新开始</button>');return}if(a==='confirmreset'){store={draft:G.defaults(),round:null,creating:true,step:1,actor:0};before=null;selected=-1;draftScores=[];notice='';persist();closeModal();render(true);return}
 if(a==='explain'){let conf=c(),h=store.round.hole;modal('第 '+(h+1)+' 洞 · 怎么算',`<p>标准杆 ${G.PAR[h]} · ${G.modeName(conf)}</p><table class="explain-table">${conf.players.map((p,i)=>{let x=G.derived(conf,i,h,store.round.records[i][h]);return `<tr><td>${esc(p.name)}</td><td>${!x.ready?'未填写':x.gross===null?'捡球 · 比赛计 '+(x.value??'采用队友成绩'):'实际 '+x.gross+(conf.basis==='net'?' − 让 '+x.handicap+' = 净杆 '+x.net:'')+'<br>本洞计 '+x.value+(conf.mode==='points'?' 分':' 杆')}</td></tr>`}).join('')}</table><p>主赛计算不会改写实际总杆，也不会再次追加已经包含的罚杆。</p>`);return}
 if(a==='concede'){let conf=c(),us=G.units(conf),r=store.round;modal('第 '+(r.hole+1)+' 洞 · 明确洞结果',`<p>仅记录双方已确认的让洞或平洞。本洞不会伪造个人杆数。让洞一旦在球场上作出不可撤回，录入错误的纠正应另行核实。</p><button class="secondary" data-outcome="1">${esc(us[1].name)} 让洞 → ${esc(us[0].name)} 赢</button><button class="secondary" data-outcome="-1">${esc(us[0].name)} 让洞 → ${esc(us[1].name)} 赢</button><button class="secondary" data-outcome="0">已开始本洞，双方确认平洞</button>${r.overrides[r.hole]!==undefined?'<button class="secondary" data-outcome="clear">更正误录：恢复按杆数比较</button>':''}`);return}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.actor!==undefined){switchActor(+d.actor);return}if(d.action){action(d.action);return}if(d.nav){if(d.nav==='create')action('new');else setView(d.nav);return}if(d.view){setView(d.view);return}if(d.template){applyTemplate(d.template);return}if(d.choice){setSetting(d.choice,d.choice==='skinsCarry'?d.value==='true':d.value);return}if(d.manual!==undefined){manualModal(+d.manual);return}if(d.hole!==undefined){goHole(+d.hole);return}if(d.player!==undefined){selected=selected===+d.player?-1:+d.player;render();return}if(d.half!==undefined){cardHalf=+d.half;render();return}if(d.editHole!==undefined){goHole(+d.editHole,+d.person);return}if(d.outcome!==undefined){if(!ownerOnly()||store.round.finished)return;const h=store.round.hole,old=store.round.overrides[h];before={actor:activeIndex(),hole:h,changes:[],override:{hole:h,from:old}};if(d.outcome==='clear')delete store.round.overrides[h];else store.round.overrides[h]=+d.outcome;addHistory('outcome',[],{detail:'第 '+(h+1)+' 洞：'+(old===undefined?'按杆数比较':old===0?'平洞':old===1?'第一方赢洞':'第二方赢洞')+' → '+(d.outcome==='clear'?'按杆数比较':d.outcome==='0'?'平洞':d.outcome==='1'?'第一方赢洞':'第二方赢洞')});persist();closeModal();render();return}if(!store.round||store.round.finished)return;const target=d.person??d.pickup??d.clear;if(target!==undefined&&!canEdit(+target)){toast('只能修改自己的成绩，代记请由创建者操作');return}if(d.step!==undefined){let i=+d.person,h=store.round.hole,n=(draftScores[i]?.gross??G.PAR[h])+(+d.step);if(n<1||n>30){toast('每洞总杆请输入 1–30 的整数');return}draftScores[i]={gross:n,kind:draftScores[i]?.kind==='given'?'given':'holed'};render();return}if(d.score!==undefined){let i=+d.person;draftScores[i]={gross:+d.score,kind:'holed'};render();return}if(d.pickup!==undefined){draftScores[+d.pickup]={gross:null,kind:'pickup'};render();return}if(d.clear!==undefined){draftScores[+d.clear]=null;render();return}});
document.addEventListener('input',e=>{let d=e.target.dataset;if(d.name!==undefined){store.draft.players[+d.name].name=e.target.value;persist()}if(d.setting==='name'||d.setting==='policy.notes'){const parts=d.setting.split('.');if(parts.length===1)store.draft.name=e.target.value;else{store.draft.policy.notes=e.target.value;store.draft.policy.confirmed=false;const chk=document.querySelector('[data-setting="policy.confirmed"]');if(chk)chk.checked=false}persist()}});
document.addEventListener('change',e=>{let d=e.target.dataset;if(e.target.id==='finish-check'){document.getElementById('confirm-finish').disabled=!e.target.checked;return}if(d.given!==undefined){if(!canEdit(+d.given)){render();return}if(draftScores[+d.given]?.gross!=null){draftScores[+d.given].kind=e.target.checked?'given':'holed';render()}return}if(d.handicap!==undefined){store.draft.players[+d.handicap].handicap=e.target.value===''?null:Number(e.target.value);persist();return}if(d.team!==undefined){store.draft.players[+d.team].team=+e.target.value;persist();return}if(d.manualHole!==undefined){store.draft.players[+d.person].manual[+d.manualHole]=e.target.value===''?null:Number(e.target.value);persist();return}if(d.setting){if(['name','policy.notes'].includes(d.setting))return;setSetting(d.setting,e.target.type==='checkbox'?e.target.checked:e.target.value)}});
document.addEventListener('keydown',e=>{const dialog=document.querySelector('.dialog');if(!dialog)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const list=[...dialog.querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')],first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
render();
</script></body></html>
