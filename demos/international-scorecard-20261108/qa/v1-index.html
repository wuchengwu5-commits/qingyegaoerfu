const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
const clone=x=>JSON.parse(JSON.stringify(x));
const fresh=()=>({scores:FIRST.map(a=>[...a,...Array(9).fill(null)]),certified:[false,false,false,false],hole:9,view:'score',cardPlayer:0,filter:'all'});
let state=fresh(),selected=0,draft=[],previous=null,toastTimer,modalReturn=null;
try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.scores?.length===4&&saved.scores.every(a=>a.length===18&&a.every(x=>x===null||Number.isInteger(x)&&x>=1&&x<=30))&&Array.isArray(saved.certified)&&saved.certified.length===4&&Number.isInteger(saved.hole)&&saved.hole>=0&&saved.hole<18&&['score','card','leader'].includes(saved.view)&&Number.isInteger(saved.cardPlayer)&&saved.cardPlayer>=0&&saved.cardPlayer<4){state=saved}}catch{}
function loadDraft(){draft=state.scores.map(a=>a[state.hole]);}
loadDraft();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('浏览器未允许保存；本次体验仍可继续');return false}}
function sum(a){return a.reduce((s,x)=>s+(x??0),0)}
function stats(a){let done=a.filter(x=>x!==null).length;let par=sum(PAR.filter((p,i)=>a[i]!==null));return {done,total:sum(a),par,relative:sum(a)-par}}
function fmt(n){return n===0?'E':n>0?'+'+n:''+n}
function color(n){return n<0?'under':n>0?'over':''}
function mark(n,p){if(n===null)return '<span class="mark missing">—</span>';let d=n-p;return `<span class="mark ${d<=-2?'eagle':d===-1?'birdie':d===1?'bogey':d>=2?'double':''}" title="${n} 杆，${label(d)}">${n}</span>`}
function label(d){return d<=-3?'信天翁或更好':d===-2?'老鹰 Eagle':d===-1?'小鸟 Birdie':d===0?'平标准杆 Par':d===1?'柏忌 Bogey':d===2?'双柏忌 Double bogey':`高于标准杆 ${d} 杆`}
function toast(message){clearTimeout(toastTimer);document.getElementById('toast').textContent=message;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',3200)}
function isDirty(){return draft.some((v,i)=>v!==state.scores[i][state.hole])}
function hero(view){let s=stats(state.scores[view==='card'?state.cardPlayer:0]);let title=view==='score'?'青野秋季邀请赛':view==='card'?'赛事记分卡':'赛事排行榜';return `<section class="hero ${view!=='score'?'compact':''}"><div class="eyebrow">${view==='score'?'QINGYE INVITATIONAL · 2026':view==='card'?'OFFICIAL STYLE · SCORECARD':'TOURNAMENT · LEADERBOARD'}</div><h2>${title}</h2><div class="hero-sub"><span class="live-dot"></span>${view==='card'?PEOPLE[state.cardPlayer].name+' · 青野秋季邀请赛 · 第一轮':view==='leader'?'个人比杆赛 · 第一轮 · 总杆排名':'个人比杆赛 · 不让杆 · 第一轮'}</div><div class="hero-bottom"><div><div class="mini-label">${view==='card'?'累计成绩 TO PAR':'我的成绩 TO PAR'}</div><div class="value">${s.done?fmt(s.relative):'—'}<small>${s.done?'相对标准杆':'尚未记分'}</small></div></div><div class="hero-stat"><div class="mini-label">已完成 THRU</div><div class="value">${s.done===18?'F':s.done}<small>${s.done===18?'本轮完赛':'/ 18 洞'}</small></div></div><div class="hero-stat"><div class="mini-label">已记总杆</div><div class="value">${s.done?s.total:'—'}</div></div></div><div class="hero-footer"><span>青野湖畔球场 · 蓝 T · PAR 72</span><span>示例赛事</span></div></section>`}
function scoreView(){let h=state.hole,p=PAR[h],filled=draft.filter(x=>x!==null).length;return hero('score')+`<section class="content"><div class="section-top"><div><div class="overline">HOLE BY HOLE</div><div class="section-title">逐洞记分</div></div><span class="pill">本洞已填 ${filled} / 4 人</span></div><div class="holes" aria-label="选择球洞">${PAR.map((_,i)=>`<button class="hole-btn ${state.scores.every(a=>a[i]!==null)?'done':''} ${i===h?'current':''}" data-hole="${i}" aria-label="第 ${i+1} 洞" ${i===h?'aria-current="true"':''}>${i+1}</button>`).join('')}</div><div class="hole-detail"><div class="hole-title">${String(h+1).padStart(2,'0')}<span>第 ${h+1} 洞</span></div><div class="hole-meta"><strong>PAR ${p}</strong><small>${YARDS[h]} YDS</small></div></div>${isDirty()?'<div class="change-banner">本洞有待保存的成绩</div>':''}<div class="players">${PEOPLE.map((person,i)=>{let s=stats(state.scores[i]);return `<article class="player ${selected===i?'selected':''}"><div class="player-head"><button class="player-select" data-player="${i}" aria-label="选择 ${person.name}"><span class="avatar">${person.initial}</span><span><span class="player-name">${person.name}${person.me?'<span class="me">我</span>':''}</span><span class="player-info" style="display:block">累计 <b class="${color(s.relative)}">${s.done?fmt(s.relative):'—'}</b> · 已记 ${s.done} 洞${state.certified[i]?' · 已交卡':''}</span></span></button><div class="stepper"><button data-step="-1" data-person="${i}" aria-label="${person.name} 减一杆" ${state.certified[i]?'disabled':''}>−</button><span class="stroke ${draft[i]===null?'empty':color(draft[i]-p)}" aria-label="${person.name} 本洞杆数">${draft[i]??'—'}</span><button data-step="1" data-person="${i}" aria-label="${person.name} 加一杆" ${state.certified[i]?'disabled':''}>+</button></div></div>${selected===i?`<div class="player-editor"><div class="quick-row">${[p-1,p,p+1].map(v=>`<button class="quick ${color(v-p)} ${draft[i]===v?'on':''}" data-value="${v}" data-person="${i}" ${state.certified[i]?'disabled':''}><b>${v}</b>${v<p?'小鸟':v===p?'标准杆':'柏忌'}</button>`).join('')}</div><div class="record-caption"><span>${draft[i]===null?'请选择本洞杆数，空白不会自动计为 Par':label(draft[i]-p)+' · 总杆已含罚杆'}</span>${draft[i]!==null&&!state.certified[i]?`<button class="clear-score" data-clear="${i}">清空</button>`:''}</div></div>`:''}</article>`}).join('')}</div><div class="utility-row"><button class="text-button" data-action="allpar">全组填入标准杆 ${p}</button><button class="text-button" data-action="undo" ${!previous?'disabled':''}>↶ 撤销上次保存</button></div><button class="primary" data-action="save">${h===17?'保存本洞，查看记分卡':`保存本洞，前往 ${h+2} 洞`}<span>→</span></button><p class="footnote">逐洞记录实际杆数（包含罚杆） · 自动计算相对标准杆</p></section>`}
function cardView(){let who=state.cardPlayer,a=state.scores[who],s=stats(a);return hero('card')+`<section class="content"><div class="player-tabs" aria-label="选择球员">${PEOPLE.map((p,i)=>`<button data-card-player="${i}" class="${who===i?'active':''}">${p.name}</button>`).join('')}</div><div class="score-summary"><div><div class="overline">ROUND 1 · GROSS SCORE</div><div class="section-title">${s.done===18?'本轮总杆':'已记总杆'}</div></div><div class="big-score">${s.done?s.total:'—'}<small>${s.done===18?'18 洞':s.done+' 洞'}</small></div></div>${[0,9].map(start=>{let part=a.slice(start,start+9),done=part.filter(x=>x!==null).length;return `<div class="round-grid"><div class="grid-heading"><span>${start===0?'前九洞 OUT':'后九洞 IN'} <small>PAR ${sum(PAR.slice(start,start+9))}</small></span><span><strong>${done?sum(part):'—'}</strong> <small>${done===9?'杆':'已记 '+done+'/9'}</small></span></div><table class="score-table"><thead><tr><th>洞号</th>${part.map((_,i)=>`<th>${start+i+1}</th>`).join('')}</tr></thead><tbody><tr class="par-row"><th>标准</th>${part.map((_,i)=>`<td>${PAR[start+i]}</td>`).join('')}</tr><tr class="score-row"><th>杆数</th>${part.map((v,i)=>`<td><button data-edit-hole="${start+i}" aria-label="查看或修改 ${PEOPLE[who].name} 第 ${start+i+1} 洞">${mark(v,PAR[start+i])}</button></td>`).join('')}</tr></tbody></table></div>`}).join('')}<div class="legend"><span><i class="eg"></i>老鹰或更好</span><span><i></i>小鸟</span><span><i class="bg"></i>柏忌</span><span><i class="db"></i>双柏忌或更差</span></div><div class="record-status"><span class="status-circle">${state.certified[who]?'✓':s.done===18?'✓':'…'}</span><div><strong>${state.certified[who]?'已完成模拟交卡':s.done===18?'18 洞已记齐，等待核对':'这一轮，还在继续'}</strong><p>${state.certified[who]?'球员与记分员确认流程已演示；此卡已锁定。':s.done===18?'核对每洞实际杆数，再由球员与记分员确认。':`尚有 ${18-s.done} 洞待记录。点击上方任一洞，可补录或修改。`}</p></div></div><button class="primary" data-action="${state.certified[who]?'receipt':s.done===18?'certify':'continue'}">${state.certified[who]?'查看模拟交卡凭证':s.done===18?'核对成绩并交卡':'继续记分'}<span>→</span></button><p class="footnote">未记分以「—」显示，不参与合计 · 圆圈与方框辅助识别成绩</p></section>`}
function competitors(){let extras=[{id:4,name:'陆景行',code:'J. LU',done:12,diff:-4},{id:5,name:'宋沐言',code:'M. SONG',done:11,diff:-2},{id:6,name:'顾时礼',code:'S. GU',done:18,diff:1},{id:7,name:'沈书禾',code:'S. SHEN',done:9,diff:3}].map(p=>{let a=PAR.slice(0,p.done);for(let i=0;i<Math.abs(p.diff);i++)a[i]+=Math.sign(p.diff);return {...p,scores:[...a,...Array(18-p.done).fill(null)]}});return [...PEOPLE.map(p=>({...p,scores:state.scores[p.id]})),...extras].map(p=>({...p,...stats(p.scores)})).sort((a,b)=>a.done===0?1:b.done===0?-1:a.relative-b.relative||a.id-b.id)}
function leaderView(){let all=competitors();let ranked=all.map((p)=>{let rank=all.findIndex(x=>x.relative===p.relative&&x.done>0)+1;let tied=all.filter(x=>x.relative===p.relative&&x.done>0).length>1;return {...p,rank:p.done?(tied?'T':'')+rank:'—'}});let rows=state.filter==='group'?ranked.filter(p=>p.id<4):ranked;return hero('leader')+`<section class="content"><div class="leader-top"><div><div class="overline">LIVE STANDINGS</div><div class="section-title">赛事排行榜</div></div><div class="segmented"><button data-filter="all" class="${state.filter==='all'?'active':''}">全部 8 人</button><button data-filter="group" class="${state.filter==='group'?'active':''}">我的小组</button></div></div><table class="leader-table"><thead><tr><th>排名</th><th>球员 PLAYER</th><th>成绩</th><th>已完成</th></tr></thead><tbody>${rows.map(p=>`<tr class="${p.me?'mine':''}"><td class="rank">${p.rank}</td><td class="pname"><button data-detail="${p.id}">${p.name}${p.me?'<span class="tiny-me">我</span>':''}<small>${p.code}</small></button></td><td class="score-num ${color(p.relative)}">${p.done?fmt(p.relative):'—'}</td><td class="thru">${p.done===18?'F':p.done+' 洞'}</td></tr>`).join('')}</tbody></table><div class="leader-note"><strong>T = 并列名次 · E = 平标准杆 · F = 本轮完赛</strong><br>按相对标准杆排序，并显示各自完洞进度。当前为阶段排名，交卡前成绩仍待核对。</div><button class="secondary" data-view="score">返回我的小组记分 →</button><p class="footnote">你的保存会更新小组成绩 · 其他小组为固定演示数据</p></section>`}
function render(resetScroll=false){let screen=document.getElementById('screen'),y=screen.scrollTop;screen.innerHTML=state.view==='card'?cardView():state.view==='leader'?leaderView():scoreView();document.getElementById('bottomnav').innerHTML=[['score','记分'],['card','记分卡'],['leader','排行榜']].map(([v,t])=>`<button data-view="${v}" class="${state.view===v?'active':''}" aria-current="${state.view===v?'page':'false'}">${icon(v)}${t}</button>`).join('');document.querySelectorAll('.demo-menu button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));let titles={score:['只管挥杆，<br>让成绩一目了然。','实际杆数、相对标准杆、完洞进度，各有自己的位置。'],card:['一张记分卡，<br>读懂整轮起伏。','保留前九、后九与合计。用熟悉的圆圈和方框，读出每一洞的表现。'],leader:['同一场比赛，<br>随时看清位置。','突出相对标准杆，同时保留完洞进度。阶段排名和最终成绩清晰区分。']};document.getElementById('side-title').innerHTML=titles[state.view][0];document.getElementById('side-copy').textContent=titles[state.view][1];screen.scrollTop=resetScroll?0:y;if(state.view==='score'){let rail=document.querySelector('.holes');rail.scrollLeft=Math.max(0,(state.hole-3)*42)}}
function changeView(v){if(isDirty()){pendingPrompt(()=>{state.view=v;render(true);persist()});return}state.view=v;persist();render(true)}
function goHole(h){let move=()=>{state.hole=h;loadDraft();state.view='score';persist();render(true)};if(isDirty())pendingPrompt(move);else move()}
function closeModal(){document.getElementById('modal').innerHTML='';if(modalReturn?.isConnected)modalReturn.focus()}
function showModal(title,body){modalReturn=document.activeElement;document.getElementById('modal').innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-header"><h3 id="dialog-title">${title}</h3><button data-action="close" aria-label="关闭弹窗">×</button></div>${body}</section></div>`;document.querySelector('.dialog button')?.focus()}
let afterDiscard=null;
function pendingPrompt(fn){afterDiscard=fn;showModal('本洞成绩还未保存','<p>离开前可以返回保存，或放弃本洞刚才的修改。</p><button class="primary" data-action="close">返回继续记分</button><button class="secondary" data-action="discard">放弃本洞修改并继续</button>')}
function save(){if(draft.some(x=>x===null)){let n=draft.filter(x=>x===null).length;toast(`还有 ${n} 位球员未填杆数，请先补齐`);selected=draft.findIndex(x=>x===null);render();document.querySelector('.player.selected')?.scrollIntoView({block:'nearest',behavior:'smooth'});return}previous=clone(state);let changed=false;draft.forEach((v,i)=>{if(!state.certified[i]){if(state.scores[i][state.hole]!==v)changed=true;state.scores[i][state.hole]=v}});let savedHole=state.hole+1;if(state.hole<17)state.hole++;else{state.view='card';state.cardPlayer=0}loadDraft();selected=0;let saved=persist();render(true);toast(saved?`第 ${savedHole} 洞已保存在此演示中`:'成绩已更新，仅保留于当前页面')}
function rules(){showModal('记分设计说明',`<p>这个原型采用个人总杆比杆赛：记录每洞实际杆数（包含罚杆），以较低成绩领先。所有球员、球场与成绩均为示例。</p><ul class="notes-list"><li>空白不是标准杆：未录入用「—」表示。</li><li>总杆 − 已记球洞标准杆 = 相对标准杆。</li><li>少一杆用红色圆圈，多一杆用蓝色方框；颜色是本演示的视觉约定。</li><li>前九、后九和总计分别显示记录进度。</li><li>18 洞记齐后，演示球员、记分员核对与交卡。</li><li>交卡后锁定。真实赛事的修订由委员会按规则处理。</li></ul><p>本版仅演示个人总杆比杆赛，不含差点、比洞赛、罚杆裁定或官方赛事数据接入。</p><div class="modal-links"><a href="https://www.randa.org/en/rog/the-rules-of-golf/rule-3" target="_blank" rel="noopener">R&A 官方规则 ↗</a><a href="https://www.pgatour.com/pages/whats-new" target="_blank" rel="noopener">PGA TOUR 界面参考 ↗</a></div>`)}
function doAction(action){if(action==='close'){closeModal();return}if(action==='save'){save();return}if(action==='discard'){loadDraft();closeModal();let fn=afterDiscard;afterDiscard=null;fn?.();return}if(action==='allpar'){draft=draft.map((v,i)=>state.certified[i]?v:PAR[state.hole]);render();toast('已填入全组标准杆，点击下方按钮保存');return}if(action==='undo'){if(!previous)return;state=previous;previous=null;loadDraft();persist();render(true);toast('已撤销上次保存');return}if(action==='continue'){let h=state.scores[state.cardPlayer].findIndex(x=>x===null);selected=state.cardPlayer;goHole(h<0?17:h);return}if(action==='rules'){rules();return}if(action==='settings'){showModal('独立演示',`<p>青野 · 国际赛事记分卡<br>可体验四人逐洞记分、完整记分卡与赛事排名。数据只保存在当前浏览器的此演示中。</p><button class="secondary" data-action="finishdemo">载入完赛示例，体验交卡</button><button class="secondary" data-action="rules">查看记分设计说明</button><button class="secondary" data-action="reset">重新开始演示</button>`);return}if(action==='finishdemo'){showModal('体验完赛流程','<p>将填入尚未记录球洞的示例成绩，并保留你已经保存的成绩。当前未保存的修改将被放弃。</p><button class="primary" data-action="confirmfinish">填入完赛示例</button><button class="secondary" data-action="close">继续当前记分</button>');return}if(action==='confirmfinish'){previous=clone(state);state.scores=state.scores.map((a,i)=>a.map((v,h)=>v??(h<9?FIRST[i][h]:LAST[i][h-9])));state.view='card';state.cardPlayer=0;loadDraft();persist();closeModal();render(true);toast('已填入完赛示例，可核对并模拟交卡');return}if(action==='reset'){showModal('重新开始演示','<p>清除此 demo 中的改动，恢复到刚打完前九洞的示例。不会影响任何小程序成绩。</p><button class="primary" data-action="confirmreset">恢复初始示例</button><button class="secondary" data-action="close">保留当前演示</button>');return}if(action==='confirmreset'){state=fresh();previous=null;selected=0;loadDraft();persist();closeModal();render(true);toast('已恢复初始示例');return}if(action==='certify'){let who=state.cardPlayer,s=stats(state.scores[who]);if(s.done!==18){toast('请先补齐全部 18 洞');return}showModal('核对并模拟交卡',`<p>${PEOPLE[who].name} · 第一轮 · 个人总杆比杆赛<br>请确认每洞成绩已核对。下方确认仅用于演示交卡流程。</p><div class="modal-summary"><div><small>前九 OUT</small><b>${sum(state.scores[who].slice(0,9))}</b></div><div><small>后九 IN</small><b>${sum(state.scores[who].slice(9))}</b></div><div><small>总杆 TOTAL</small><b>${s.total}</b></div><div><small>相对标准杆</small><b class="${color(s.relative)}">${fmt(s.relative)}</b></div></div><label class="check-row"><input type="checkbox" id="player-check">球员已核对全部 18 洞成绩（模拟）</label><label class="check-row"><input type="checkbox" id="marker-check">记分员已确认逐洞成绩（模拟）</label><button class="primary" data-action="submit" id="submit-button" disabled>确认模拟交卡</button><p class="footnote">交卡后锁定此卡 · 此操作不构成真实赛事签名或提交</p>`);return}if(action==='submit'){if(!document.getElementById('player-check')?.checked||!document.getElementById('marker-check')?.checked)return;state.certified[state.cardPlayer]=true;previous=null;persist();closeModal();render();toast('模拟交卡完成，记分卡已锁定');return}if(action==='receipt'){let s=stats(state.scores[state.cardPlayer]);showModal('模拟交卡凭证',`<div class="record-status"><span class="status-circle">✓</span><div><strong>${PEOPLE[state.cardPlayer].name} · 第一轮</strong><p>18 洞 · 总杆 ${s.total} · ${fmt(s.relative)}</p></div></div><p>球员核对：已模拟确认<br>记分员确认：已模拟确认<br>记分卡状态：已锁定</p><p>这是独立 demo 的流程演示，没有提交给任何真实赛事。重新开始演示可恢复初始数据。</p>`);return}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(d.action){doAction(d.action);return}if(d.view){changeView(d.view);return}if(d.hole!==undefined){goHole(+d.hole);return}if(d.player!==undefined){selected=+d.player;render();return}if(d.cardPlayer!==undefined){state.cardPlayer=+d.cardPlayer;persist();render();return}if(d.step!==undefined){let i=+d.person;if(state.certified[i])return;selected=i;let n=(draft[i]??PAR[state.hole])+(+d.step);if(n<1||n>30){toast('本演示支持每洞 1—30 杆');return}draft[i]=n;render();return}if(d.value!==undefined){if(state.certified[+d.person])return;draft[+d.person]=+d.value;render();return}if(d.clear!==undefined){draft[+d.clear]=null;render();return}if(d.editHole!==undefined){selected=state.cardPlayer;goHole(+d.editHole);return}if(d.filter){state.filter=d.filter;persist();render();return}if(d.detail!==undefined){let id=+d.detail;if(id<4){state.cardPlayer=id;changeView('card')}else{let p=competitors().find(x=>x.id===id);showModal(p.name+' · 成绩摘要',`<p>第一轮 · ${p.done===18?'已完赛':'已完成 '+p.done+' 洞'}<br>已记总杆 ${p.total} · 相对标准杆 ${fmt(p.relative)}</p><p>这位球员属于其他小组，成绩为固定演示数据。本组四位球员的逐洞记分卡可以编辑与核对。</p>`)}}});
document.addEventListener('change',()=>{let submit=document.getElementById('submit-button');if(submit)submit.disabled=!(document.getElementById('player-check').checked&&document.getElementById('marker-check').checked)});
document.addEventListener('keydown',e=>{let dialog=document.querySelector('.dialog');if(!dialog)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){let list=[...dialog.querySelectorAll('button:not(:disabled),input,a[href]')],first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});
render();
</script>
</body>
</html>
